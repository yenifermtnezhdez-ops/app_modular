
name: app_modular
description: "Aplicación modular con autenticación, radio y noticias."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Diseño
  google_fonts: ^9.0.0

  # Estado
  provider: ^6.1.5+1

  # Firebase y autenticación
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1

  # Notificaciones
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Radio y reproducción
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # Noticias y conexiones
  http: ^1.6.0
  flutter_html: ^3.0.0
  connectivity_plus: ^7.3.2

  # Almacenamiento y archivos
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  image_picker: ^1.2.4

  # Componentes y navegación
  url_launcher: ^6.3.3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  html: 0.15.6

flutter:
  uses-material-design: true
